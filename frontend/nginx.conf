# =============================================================
# Nginx 配置：托管前端静态文件 + 反向代理后端 API
# =============================================================
#
# 【为什么要用 Nginx 代理 API，而不是让浏览器直连后端】
#
# 直连的话就是跨域（前端 :80，后端 :8080），要处理：
#   * CORS 白名单
#   * 带凭证的跨域 cookie（SameSite / Secure / Domain 一堆细节）
#   * 后端必须额外暴露一个端口到宿主机
#
# 走同源代理，这三件事**全都消失了**：浏览器只认识 :80 这一个源，
# cookie 自然同源，后端只在容器网络里可达、不对宿主机暴露端口。
# 这跟设计文档里「生产环境前后端同源（Nginx 分流）」是同一套思路。
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩。已经压过的不重复压（图片/字体）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    # -------------------------------------------------------------
    # API 反向代理
    # -------------------------------------------------------------
    location /api/ {
        # 注意这里是 api:8080 —— 容器里的 localhost 是容器自己，
        # 数据库和后端都在别的容器里（compose 会把服务名注册成 DNS）
        proxy_pass http://api:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【必须放宽】「AI 讲解」是同步等 LLM 生成的，实测要十几秒。
        # Nginx 默认 60s，看起来够，但模型偶尔会慢到一分钟以上，
        # 那时会返回 504 —— 前端只看到"生成失败"，很难联想到是网关超时。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # LLM 是流式返回的场景下关掉缓冲，避免攒着一次性吐出
        proxy_buffering off;
    }

    # 后端健康检查透传（精确匹配，不会和前端路由冲突）
    location = /health {
        proxy_pass http://api:8080/health;
    }

    # -------------------------------------------------------------
    # SPA 静态资源
    # -------------------------------------------------------------
    # Vite 构建出来的文件名带内容哈希，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # 【Vue Router 的 history 模式必需】
    # 用户直接访问 /notes/123 时，磁盘上并没有这个文件。
    # try_files 会依次找 $uri、$uri/，都找不到就交给 index.html，
    # 由前端路由自己解析路径。
    # 少了这一行，刷新任何子页面都会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
